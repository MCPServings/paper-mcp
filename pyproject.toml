[project]
name = "paper-mcp"
version = "0.3.0"
description = "Remotely callable MCP server for academic paper search (arXiv baseline)."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.27.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
    "starlette>=0.37.0",
]

[project.scripts]
paper-mcp = "paper_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paper_mcp"]
